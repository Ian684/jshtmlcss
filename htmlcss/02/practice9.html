<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            width: 500px;
        }
        .item{
            flex-grow: 1;
            flex-basis: 1;
            /* flex: 1 1 1; == grow shrink basis */
            width: 100px;
        }
        .item:nth-of-type(1){
            flex-shrink: 10;
        }
        /* 
        justify-content
        flex-direction
        order
        align-items
        align-content
        flex-flow(align-self,flex-wrap)
         */
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>



</body>
</html>
