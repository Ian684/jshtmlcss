<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login.css">
    <script src="./login.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="trademark">
            <img src="./head.png" alt="head" height="200px">
        </div>
        <form action="" id="login" class="login">
            <input type="text" placeholder="Username" id="username" class="username" name="username" required>
            <input type="password" placeholder="Password" id="password" class="password" name="password" required>
            <button id="login-btn">Login</button>
        </form>
        <div class="forgot">
            <a href="">forgot your password?</a>
            <!-- forgot link -->
        </div>
        <div class="create">
            <a href="">create a new account</a>
            <!-- create link -->
        </div>
    </div>     
</body>
</html>
