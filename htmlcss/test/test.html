<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB作業一</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.4;
            transition: background 0.5s, color 0.5s;
        }

        header {
            background: #2d587d;
            color: rgb(222, 224, 102);
            padding: 1px 0px;
            text-align: center;
        }
        nav {
            background: #4973f1;
            display: flex;
            justify-content: center;
            padding: 0.5rem 0;
        }

        nav a {
            color: rgb(220, 147, 47);
            text-decoration: none;
            margin: 0 1rem;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            position: relative;
            padding-bottom: 100px;
        }

        .item1{
            position: absolute;
            left: 50px;
            font-size: 1.5rem;
        }

        .item1 img{
            width: 50%;
        }

        .item2{
            position: absolute;
            left: 600px;
            font-size: 1.5rem;
        }

        .item3{
            position: absolute;
            left: 1100px;
            font-size: 1.5rem;
        }

        footer {
            background: #333;
            color: white;
            font-size: 1.0rem;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .dark-mode {
            background: #1e1e1e;
            color: #f5f5f5;
        }

        .light-mode {
            background: #ffffff;
            color: #000000;
        }

        .colorful-mode {
            background: linear-gradient(135deg, #0a2694, #43bdea, #294bba);
            color: #2d3436;
        }

        .buttons {
            position: absolute;
            left: 1100px;
            bottom:0.5px;
            text-align: center;
            margin: 1rem;
        }
        .buttons button {
            margin: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>楊竣崴的部落格</h1>
        <p>元智資工大一A班新生</p>
    </header>
    <nav>
        <a href="#home">個人照</a>
        <a href="#about">個人資料</a>
        <a href="#contact">興趣</a>
    </nav>

    <div class="container">
        <div class="item1">
            <h2 id="photo">個人照</h2>
            <img src="photo.jpg" alt="IG">
        </div>
        <div class="item2">
            <h2 id="home">個人資料</h2>
            <p>姓名:楊竣崴</p>
            <p>生日:2007/01/05</p>
            <p>學校:元智大學</p>
            <p>科系:資訊工程學系</p>
        </div>
        <div class="item3">
            <h2 id="about">興趣</h2>
            <li>玩桌遊</li>
            <li>吃美食甜點</li>
            <li>聽音樂(中、日、英)</li>
            <li>打電動(傳說、荒野、特戰...)</li>
            <li>運動(籃球、排球、撞球、飛鏢...)</li>
        </div>
    </div>
    <footer>
      <div class="buttons">
        <button onclick="setTheme('light-mode')">亮色模式</button>
        <button onclick="setTheme('dark-mode')">深色模式</button>
        <button onclick="setTheme('colorful-mode')">繽紛模式</button>
      </div>
      <p>聯絡方式:&nbsp;&nbsp;&nbsp;&nbsp;IG:_w1ll.r &nbsp;&nbsp;&nbsp;&nbsp; MSG:Will Yang</p>
    </footer>

    <script>
        function setTheme(theme) {
            document.body.className = theme;
        }
    </script>
</body>
</html>
