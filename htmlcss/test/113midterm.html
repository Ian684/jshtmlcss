<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            height: 700px;
            border: 1px dashed black;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }
        .title{
            width: 98%;
            height: 17%;
            border: 1px dashed black;
        }
        .row{
            width: 98%;
            height: 62%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .para{
            width: 48%;
            height: 100%;
            border: 1px dashed black;
        }
        .right{
            width: 48%;
            height: 100%;
            border: 1px dashed black;    
        }
        .right ol{
            list-style-type: lower-alpha;
            padding-left: 20px;
        }
        .footer{
            width: 98%;
            height: 17%;
            border: 1px dashed black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">title</div>
        <div class="row">
            <div class="para">paragraph</div>
            <div class="right">
                <ol start="1">
                    <li>1</li>
                    <li>1</li>
                    <li>1</li>
                    <li>1</li>
                    <li>1</li>
                </ol>
            </div>
        </div>
        <div class="footer">foot</div>
    </div>
</body>
</html>
