<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; }
    body { margin: 0; background: #eef3f8; }
    .shell { max-width: 760px; margin: 32px auto; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 12px 30px #9aa5b1; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button, input, select { font: inherit; padding: 9px 12px; }
    button { border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    #result { min-height: 48px; padding: 12px; border-radius: 8px; background: #f7f9fc; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Counter</h1>
      <p id="result">Ready</p>
      <div class="row">
        <input id="value" type="text" value="12">
        <button id="action" type="button">Run</button>
      </div>
      <h2>Details</h2>
      <ul>
        <li>Standalone example</li>
        <li>Browser-only implementation</li>
        <li>Exercise number 10</li>
      </ul>
    </section>
  </main>
  <script>
    const value = document.querySelector("#value");
    const result = document.querySelector("#result");
    document.querySelector("#action").addEventListener("click", () => {
      const number = Number(value.value);
      if (!Number.isFinite(number)) {
        result.textContent = "Enter a valid number";
        return;
      }
      const doubled = number * 2;
      const squared = number * number;
      result.textContent = `Input ${number}; doubled ${doubled}; squared ${squared}`;
    });
  </script>
</body>
</html>
