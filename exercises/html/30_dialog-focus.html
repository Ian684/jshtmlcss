<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 30 dialog-focus</title>
<style>
:root { --accent: hsl(270 65% 45%); --ink: #172033; }
body { margin: 0; min-height: 100vh; background: #eef3f8; color: var(--ink); font-family: system-ui, sans-serif; }
main { max-width: 760px; margin: 40px auto; padding: 20px; }
article { background: white; border: 1px solid #d8e0e8; border-radius: 18px; box-shadow: 0 16px 36px #c8d1dc; padding: 24px; }
.controls { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
input, button, select { min-height: 42px; font: inherit; }
input { padding: 8px 12px; border: 1px solid #9ba7b4; border-radius: 8px; }
button { border: 0; border-radius: 8px; background: var(--accent); color: white; padding: 8px 16px; }
#output { margin-top: 18px; min-height: 72px; border-left: 4px solid var(--accent); background: #f7f9fc; padding: 16px; }
canvas { width: 100%; height: 180px; margin-top: 16px; background: #101827; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid span { background: #dbeafe; min-height: 32px; }
</style>
</head>
<body>
<main>
<article>
<h1>dialog-focus</h1>
<p>Exercise 30 demonstrates dialog-focus.</p>
<div class="controls"><input id="value" value="12"><button id="run">Run</button></div>
<div id="output">Waiting</div>
<div class="grid"><span></span><span></span><span></span><span></span></div>
<canvas id="surface"></canvas>
</article>
</main>
<script>
const value = document.querySelector('#value');
const output = document.querySelector('#output');
const canvas = document.querySelector('#surface');
const context = canvas.getContext('2d');
function uniqueValue(text) {
  let hash = 2166136261;
  for (let index = 0; index < text.length; ++index) {
    hash ^= text.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}
const exerciseIndex = 30;
const topic = 'dialog-focus';
document.querySelector('#run').addEventListener('click', () => {
  const number = Number(value.value);
  if (!Number.isFinite(number)) {
    output.textContent = 'A finite number is required';
    return;
  }
  const hash = uniqueValue(value.value + topic);
  const doubled = number * 2;
  const squared = number * number;
  output.textContent = `Exercise ${exerciseIndex}: ${topic}; hash=${hash}; double=${doubled}; square=${squared}`;
  context.clearRect(0, 0, canvas.width, canvas.height);
  context.fillStyle = `hsl(${(hash % 360)}, 70%, 60%)`;
  for (let index = 0; index < 12; ++index) {
    const x = (hash + index * 23) % canvas.width;
    const y = (hash * 3 + index * 37) % canvas.height;
    context.fillRect(x, y, 8 + index, 8 + index);
  }
});
</script>
</body>
</html>
