<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Guess</title>
<style>body{margin:0;font-family:system-ui;background:#eef2f7;color:#172033}main{max-width:760px;margin:48px auto;padding:20px}section{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 30px #ccd4df}button,input,select{font:inherit;padding:.55rem .7rem;margin:.25rem}#output{margin-top:16px;padding:14px;background:#f7f9fc;border-radius:8px;min-height:3rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{height:60px;background:#2563eb}nav button{margin-right:6px}canvas{width:100%;height:180px;background:#111827}</style></head>
<body><main><section><h1>Number Guess</h1><p>Interactive exercise: number guess</p><div id="controls"></div><div id="output" aria-live="polite">Ready</div></section></main>
<script>
const controls=document.querySelector('#controls'),output=document.querySelector('#output');
const topic='number-guess';
let secret=Math.floor(Math.random()*100)+1;controls.innerHTML='<input id=g type=number min=1 max=100><button>Guess</button>';controls.querySelector('button').onclick=()=>{let n=+controls.querySelector('#g').value;output.textContent=n===secret?'Correct!':n<secret?'Higher':'Lower'};
</script></body></html>
