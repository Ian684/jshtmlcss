<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>number-guess</title>
<style>
:root{--accent25:hsl(225 68% 48%)}
body{margin:0;font-family:system-ui;background:#edf2f7}
main{max-width:760px;margin:48px auto;padding:20px}
article{background:white;border-radius:18px;padding:28px;box-shadow:0 18px 40px #ccd5df}
.controls{display:grid;grid-template-columns:1fr auto;gap:12px}
input,button{min-height:44px;font:inherit}
#output{min-height:72px;margin-top:16px;padding:16px;background:#f8fafc}
canvas{width:100%;height:160px;background:#111827}
</style>
</head>
<body>
<main><article>
<h1>Exercise 25: number-guess</h1>
<div class="controls"><input id="value" value="12"><button id="run">Run</button></div>
<div id="output">Waiting</div>
<canvas id="surface" width="720" height="160"></canvas>
</article></main>
<script>
const topic='number-guess';
const input=document.querySelector('#value');
const output=document.querySelector('#output');
const canvas=document.querySelector('#surface');
const context=canvas.getContext('2d');
document.querySelector('#run').onclick=()=>{
const number=Number(input.value);
if(!Number.isFinite(number)){output.textContent='finite number required';return;}
const result=number*number+number*3;
output.textContent=`${topic}: ${result}`;
context.clearRect(0,0,canvas.width,canvas.height);
context.fillStyle='#2563eb';
