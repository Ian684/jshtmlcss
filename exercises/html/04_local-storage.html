<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Storage</title>
<style>body{margin:0;font-family:system-ui;background:#eef2f7;color:#172033}main{max-width:760px;margin:48px auto;padding:20px}section{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 30px #ccd4df}button,input,select{font:inherit;padding:.55rem .7rem;margin:.25rem}#output{margin-top:16px;padding:14px;background:#f7f9fc;border-radius:8px;min-height:3rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{height:60px;background:#2563eb}nav button{margin-right:6px}canvas{width:100%;height:180px;background:#111827}</style></head>
<body><main><section><h1>Local Storage</h1><p>Interactive exercise: local storage</p><div id="controls"></div><div id="output" aria-live="polite">Ready</div></section></main>
<script>
const controls=document.querySelector('#controls'),output=document.querySelector('#output');
const topic='local-storage';
controls.innerHTML='<input id=k value=name><button id=set>Save</button><button id=get>Load</button>';controls.querySelector('#set').onclick=()=>{localStorage.setItem('exercise-name',controls.querySelector('#k').value);output.textContent='Saved'};controls.querySelector('#get').onclick=()=>output.textContent=localStorage.getItem('exercise-name')||'Nothing saved';
</script></body></html>
