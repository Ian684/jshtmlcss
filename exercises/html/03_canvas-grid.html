<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Grid</title>
<style>body{margin:0;font-family:system-ui;background:#eef2f7;color:#172033}main{max-width:760px;margin:48px auto;padding:20px}section{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 30px #ccd4df}button,input,select{font:inherit;padding:.55rem .7rem;margin:.25rem}#output{margin-top:16px;padding:14px;background:#f7f9fc;border-radius:8px;min-height:3rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{height:60px;background:#2563eb}nav button{margin-right:6px}canvas{width:100%;height:180px;background:#111827}</style></head>
<body><main><section><h1>Canvas Grid</h1><p>Interactive exercise: canvas grid</p><div id="controls"></div><div id="output" aria-live="polite">Ready</div></section></main>
<script>
const controls=document.querySelector('#controls'),output=document.querySelector('#output');controls.innerHTML='<canvas id=c width=600 height=180></canvas>';const c=controls.querySelector('#c'),x=c.getContext('2d');for(let y=0;y<c.height;y+=20)for(let col=0;col<c.width;col+=20){x.fillStyle=(col/20+y/20)%2?'#60a5fa':'#2563eb';x.fillRect(col,y,20,20);}c.onclick=e=>{const r=c.getBoundingRect?c.getBoundingRect():c.getBoundingClientRect();output.textContent='Grid cell: '+Math.floor((e.clientX-r.left)/20)+','+Math.floor((e.clientY-r.top)/20)};
</script></body></html>
