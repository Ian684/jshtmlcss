<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas Particles</title>
<style>body{margin:0;font-family:system-ui;background:#eef2f7;color:#172033}main{max-width:760px;margin:48px auto;padding:20px}section{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 30px #ccd4df}button,input,select{font:inherit;padding:.55rem .7rem;margin:.25rem}#output{margin-top:16px;padding:14px;background:#f7f9fc;border-radius:8px;min-height:3rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{height:60px;background:#2563eb}nav button{margin-right:6px}canvas{width:100%;height:180px;background:#111827}</style></head>
<body><main><section><h1>Canvas Particles</h1><p>Interactive exercise: canvas particles</p><div id="controls"></div><div id="output" aria-live="polite">Ready</div></section></main>
<script>
const controls=document.querySelector('#controls'),output=document.querySelector('#output');controls.innerHTML='<canvas id=c width=600 height=180></canvas>';const c=controls.querySelector('#c'),x=c.getContext('2d'),ps=Array.from({length:35},()=>({x:Math.random()*600,y:Math.random()*180,vx:1-Math.random()*2,vy:1-Math.random()*2}));function draw(){x.clearRect(0,0,600,180);for(const p of ps){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>600)p.vx*=-1;if(p.y<0||p.y>180)p.vy*=-1;x.fillStyle='#60a5fa';x.fillRect(p.x,p.y,4,4);}requestAnimationFrame(draw)}draw();
</script></body></html>
