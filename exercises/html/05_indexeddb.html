<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indexeddb</title>
<style>body{margin:0;font-family:system-ui;background:#eef2f7;color:#172033}main{max-width:760px;margin:48px auto;padding:20px}section{background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 30px #ccd4df}button,input,select{font:inherit;padding:.55rem .7rem;margin:.25rem}#output{margin-top:16px;padding:14px;background:#f7f9fc;border-radius:8px;min-height:3rem}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{height:60px;background:#2563eb}nav button{margin-right:6px}canvas{width:100%;height:180px;background:#111827}</style></head>
<body><main><section><h1>Indexeddb</h1><p>Interactive exercise: indexeddb</p><div id="controls"></div><div id="output" aria-live="polite">Ready</div></section></main>
<script>
const controls=document.querySelector('#controls'),output=document.querySelector('#output');controls.innerHTML='<input id=v value=hello><button id=s>Save</button><button id=l>Load</button>';let db;const open=indexedDB.open('exercise-db',1);open.onupgradeneeded=()=>open.result.createObjectStore('items',{keyPath:'id'});open.onsuccess=()=>db=open.result;controls.querySelector('#s').onclick=()=>{if(!db)return;const tx=db.transaction('items','readwrite');tx.objectStore('items').put({id:'message',value:controls.querySelector('#v').value});tx.oncomplete=()=>output.textContent='Saved';};controls.querySelector('#l').onclick=()=>{if(!db)return;const tx=db.transaction('items');const r=tx.objectStore('items').get('message');r.onsuccess=()=>output.textContent=r.result?r.result.value:'Nothing saved';};
</script></body></html>
