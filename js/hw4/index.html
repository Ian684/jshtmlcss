<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>打磚塊 13 功能版</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1f2933, #020617);
      color: #f9fafb;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    canvas {
      border-radius: 12px;
      background: #020617;
      box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    .panel {
      max-width: 900px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      padding: 6px 4px;
      color: #e5e7eb;
    }
    .panel span {
      margin-right: 12px;
    }
    .tag {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      font-size: 11px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .panel-right {
      font-size: 12px;
      opacity: 0.9;
    }
    .panel-right b {
      color: #22c55e;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="panel">
    <div>
      <span>分數：<span id="score">0</span></span>
      <span>生命：<span id="lives">3</span></span>
      <span>關卡：<span id="level">1</span></span>
      <span class="tag">方向鍵 / A D 移動</span>
    </div>
    <div class="panel-right">
      掉落道具：E 加長、S 短、M 多球、F 火球、K 黏、U 加速、D 減速、L 命、Z 雷射、H 護盾、B 大球、C 小球、R 反轉
    </div>
  </div>
  <canvas id="game" width="900" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');

  const W = canvas.width;
  const H = canvas.height;

  const POWER_TYPES = [
    "expand", "shrink", "multi", "fire", "sticky",
    "speedUp", "slowDown", "life", "laser",
    "shield", "bigBall", "smallBall", "reverse"
  ];

  const POWER_LABEL = {
    expand: "E",
    shrink: "S",
    multi: "M",
    fire: "F",
    sticky: "K",
    speedUp: "U",
    slowDown: "D",
    life: "L",
    laser: "Z",
    shield: "H",
    bigBall: "B",
    smallBall: "C",
    reverse: "R"
  };

  const BASE_PADDLE_WIDTH = 120;
  const BASE_PADDLE_HEIGHT = 16;
  const BASE_PADDLE_SPEED = 9;

  const ROWS = 6;
  const COLS = 12;
  const BRICK_MARGIN_TOP = 60;
  const BRICK_HEIGHT = 20;
  const BRICK_GAP = 4;

  const BASE_BALL_RADIUS = 8;
  const BASE_BALL_SPEED = 6;

  const POWER_DROP_CHANCE = 0.3;
  const POWER_SIZE = 20;
  const POWER_SPEED = 3.2;

  const LASER_BULLET_SPEED = 9;
  const LASER_COOLDOWN_FRAMES = 30;

  const EFFECT_DURATION_FRAMES = 60 * 10;

  let paddle;
  let balls;
  let bricks;
  let powerups;
  let bullets;

  let score = 0;
  let lives = 3;
  let level = 1;

  let keyLeft = false;
  let keyRight = false;

  let effectTimers = {
    expand: 0,
    shrink: 0,
    fire: 0,
    sticky: 0,
    speedUp: 0,
    slowDown: 0,
    laser: 0,
    shield: 0,
    bigBall: 0,
    smallBall: 0,
    reverse: 0
  };

  let laserCooldown = 0;

  function resetPaddle() {
    paddle = {
      x: W / 2 - BASE_PADDLE_WIDTH / 2,
      y: H - 40,
      width: BASE_PADDLE_WIDTH,
      height: BASE_PADDLE_HEIGHT,
      speed: BASE_PADDLE_SPEED
    };
  }

  function resetBalls(single = true) {
    balls = [];
    const ball = {
      x: W / 2,
      y: H - 60,
      dx: (Math.random() < 0.5 ? -1 : 1) * BASE_BALL_SPEED * 0.7,
      dy: -BASE_BALL_SPEED,
      radius: BASE_BALL_RADIUS
    };
    balls.push(ball);
    if (!single) {
      const b2 = { ...ball, dx: -ball.dx };
      balls.push(b2);
    }
  }

  function createBricks() {
    bricks = [];
    const totalGapWidth = (COLS + 1) * BRICK_GAP;
    const brickWidth = (W - totalGapWidth) / COLS;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = BRICK_GAP + c * (brickWidth + BRICK_GAP);
        const y = BRICK_MARGIN_TOP + r * (BRICK_HEIGHT + BRICK_GAP);

        let color;
        if (r < 2) color = "#f97316";
        else if (r < 4) color = "#22c55e";
        else color = "#38bdf8";

        let power = null;
        if (Math.random() < POWER_DROP_CHANCE) {
          const idx = Math.floor(Math.random() * POWER_TYPES.length);
          power = POWER_TYPES[idx];
        }

        bricks.push({
          x, y, width: brickWidth, height: BRICK_HEIGHT,
          alive: true,
          color,
          power
        });
      }
    }
  }

  function resetEffects() {
    for (const k in effectTimers) effectTimers[k] = 0;
    laserCooldown = 0;
  }

  function resetGame(full = false) {
    if (full) {
      score = 0;
      lives = 3;
      level = 1;
    }
    resetPaddle();
    resetBalls();
    createBricks();
    powerups = [];
    bullets = [];
    resetEffects();

    scoreEl.textContent = score;
    livesEl.textContent = lives;
    levelEl.textContent = level;
  }

  function drawPaddle() {
    ctx.save();
    ctx.fillStyle = "#e5e7eb";
    ctx.shadowColor = "#22c55e";
    ctx.shadowBlur = 10;
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.restore();
  }

  function drawBall(ball) {
    ctx.save();
    ctx.beginPath();
    if (effectTimers.fire > 0) {
      const grad = ctx.createRadialGradient(ball.x, ball.y, 2, ball.x, ball.y, ball.radius);
      grad.addColorStop(0, "#fef3c7");
      grad.addColorStop(1, "#f97316");
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = "#e5e7eb";
    }
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBrick(brick) {
    if (!brick.alive) return;
    ctx.save();
    ctx.fillStyle = brick.color;
    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
    if (brick.power) {
      ctx.fillStyle = "rgba(15,23,42,.8)";
      ctx.font = "bold 12px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(POWER_LABEL[brick.power], brick.x + brick.width / 2, brick.y + brick.height / 2);
    }
    ctx.restore();
  }

  function drawPowerup(p) {
    ctx.save();
    ctx.fillStyle = "#facc15";
    ctx.fillRect(p.x, p.y, p.size, p.size);
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(POWER_LABEL[p.type], p.x + p.size / 2, p.y + p.size / 2);
    ctx.restore();
  }

  function drawBullets() {
    ctx.save();
    ctx.fillStyle = "#38bdf8";
    bullets.forEach(b => {
      ctx.fillRect(b.x - 2, b.y - 10, 4, 10);
    });
    ctx.restore();
  }

  function drawShield() {
    if (effectTimers.shield <= 0) return;
    const y = H - 30;
    ctx.save();
    ctx.strokeStyle = "#22c55e";
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 6]);
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(W - 40, y);
    ctx.stroke();
    ctx.restore();
  }

  function updatePaddle() {
    let actualLeft = keyLeft;
    let actualRight = keyRight;
    if (effectTimers.reverse > 0) {
      actualLeft = keyRight;
      actualRight = keyLeft;
    }

    if (actualLeft && !actualRight) {
      paddle.x -= paddle.speed;
    } else if (actualRight && !actualLeft) {
      paddle.x += paddle.speed;
    }

    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > W) paddle.x = W - paddle.width;
  }

  function updateBalls() {
    const newBalls = [];

    for (const ball of balls) {
      let speedFactor = 1;
      if (effectTimers.speedUp > 0) speedFactor *= 1.4;
      if (effectTimers.slowDown > 0) speedFactor *= 0.6;

      ball.x += ball.dx * speedFactor;
      ball.y += ball.dy * speedFactor;

      if (ball.x - ball.radius < 0) {
        ball.x = ball.radius;
        ball.dx = Math.abs(ball.dx);
      } else if (ball.x + ball.radius > W) {
        ball.x = W - ball.radius;
        ball.dx = -Math.abs(ball.dx);
      }

      if (ball.y - ball.radius < 0) {
        ball.y = ball.radius;
        ball.dy = Math.abs(ball.dy);
      }

      if (effectTimers.shield > 0) {
        const shieldY = H - 30;
        if (ball.y + ball.radius >= shieldY && ball.dy > 0 && ball.y + ball.radius < shieldY + 12) {
          ball.y = shieldY - ball.radius;
          ball.dy = -Math.abs(ball.dy);
        }
      }

      const inPaddleX = ball.x > paddle.x && ball.x < paddle.x + paddle.width;
      const inPaddleY = ball.y + ball.radius >= paddle.y && ball.y + ball.radius <= paddle.y + paddle.height + 10;

      if (inPaddleX && inPaddleY && ball.dy > 0) {
        ball.y = paddle.y - ball.radius;
        ball.dy = -Math.abs(ball.dy);

        let hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        if (hitPos < -1) hitPos = -1;
        if (hitPos > 1) hitPos = 1;
        ball.dx = hitPos * BASE_BALL_SPEED * (effectTimers.speedUp > 0 ? 1.4 : 1);

        if (effectTimers.sticky <= 0 && Math.abs(ball.dx) < 1) {
          ball.dx = (Math.random() < 0.5 ? -1 : 1) * BASE_BALL_SPEED * 0.4;
        }
      }

      if (ball.y - ball.radius > H) {
        continue;
      }

      handleBallBrickCollision(ball);

      newBalls.push(ball);
    }

    if (newBalls.length === 0) {
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) {
        resetGame(true);
      } else {
        resetPaddle();
        resetBalls();
      }
    } else {
      balls = newBalls;
    }
  }

  function handleBallBrickCollision(ball) {
    for (const brick of bricks) {
      if (!brick.alive) continue;

      const nearestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.width));
      const nearestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.height));
      const distX = ball.x - nearestX;
      const distY = ball.y - nearestY;
      const distSq = distX * distX + distY * distY;

      if (distSq <= ball.radius * ball.radius) {
        brick.alive = false;
        score += 10;
        scoreEl.textContent = score;

        if (brick.power) {
          powerups.push({
            x: brick.x + brick.width / 2 - POWER_SIZE / 2,
            y: brick.y,
            size: POWER_SIZE,
            type: brick.power,
            vy: POWER_SPEED
          });
        }

        if (effectTimers.fire <= 0) {
          if (Math.abs(distX) > Math.abs(distY)) {
            ball.dx = distX > 0 ? Math.abs(ball.dx) * 1 : -Math.abs(ball.dx);
          } else {
            ball.dy = distY > 0 ? Math.abs(ball.dy) * 1 : -Math.abs(ball.dy);
          }
        }
        break;
      }
    }

    if (bricks.every(b => !b.alive)) {
      level++;
      levelEl.textContent = level;
      createBricks();
      resetPaddle();
      resetBalls(false);
    }
  }

  function updatePowerups() {
    const remaining = [];
    for (const p of powerups) {
      p.y += p.vy;
      const hitX = p.x + p.size > paddle.x && p.x < paddle.x + paddle.width;
      const hitY = p.y + p.size > paddle.y && p.y < paddle.y + paddle.height;
      if (hitX && hitY) {
        applyPowerup(p.type);
        continue;
      }
      if (p.y > H) continue;
      remaining.push(p);
    }
    powerups = remaining;
  }

  function updateBullets() {
    if (effectTimers.laser > 0) {
      if (laserCooldown <= 0) {
        bullets.push({
          x: paddle.x + paddle.width / 2,
          y: paddle.y
        });
        laserCooldown = LASER_COOLDOWN_FRAMES;
      } else {
        laserCooldown--;
      }
    } else {
      laserCooldown = 0;
    }

    const aliveBullets = [];
    for (const b of bullets) {
      b.y -= LASER_BULLET_SPEED;
      if (b.y < 0) continue;

      for (const brick of bricks) {
        if (!brick.alive) continue;
        if (b.x >= brick.x && b.x <= brick.x + brick.width &&
            b.y >= brick.y && b.y <= brick.y + brick.height) {
          brick.alive = false;
          score += 10;
          scoreEl.textContent = score;

          if (brick.power) {
            powerups.push({
              x: brick.x + brick.width / 2 - POWER_SIZE / 2,
              y: brick.y,
              size: POWER_SIZE,
              type: brick.power,
              vy: POWER_SPEED
            });
          }
          b.y = -999;
          break;
        }
      }

      if (b.y > 0) aliveBullets.push(b);
    }
    bullets = aliveBullets;
  }

  function applyPowerup(type) {
    switch (type) {
      case "expand":
        effectTimers.expand = EFFECT_DURATION_FRAMES;
        effectTimers.shrink = 0;
        break;
      case "shrink":
        effectTimers.shrink = EFFECT_DURATION_FRAMES;
        effectTimers.expand = 0;
        break;
      case "multi":
        if (balls.length < 6) {
          const newBalls = [];
          for (const b of balls) {
            const b1 = { ...b, dx: b.dx * 1 };
            const b2 = { ...b, dx: -b.dx * 1 };
            newBalls.push(b1, b2);
          }
          balls = newBalls;
        }
        break;
      case "fire":
        effectTimers.fire = EFFECT_DURATION_FRAMES;
        break;
      case "sticky":
        effectTimers.sticky = EFFECT_DURATION_FRAMES;
        break;
      case "speedUp":
        effectTimers.speedUp = EFFECT_DURATION_FRAMES;
        break;
      case "slowDown":
        effectTimers.slowDown = EFFECT_DURATION_FRAMES;
        break;
      case "life":
        lives++;
        livesEl.textContent = lives;
        break;
      case "laser":
        effectTimers.laser = EFFECT_DURATION_FRAMES;
        break;
      case "shield":
        effectTimers.shield = EFFECT_DURATION_FRAMES;
        break;
      case "bigBall":
        effectTimers.bigBall = EFFECT_DURATION_FRAMES;
        effectTimers.smallBall = 0;
        break;
      case "smallBall":
        effectTimers.smallBall = EFFECT_DURATION_FRAMES;
        effectTimers.bigBall = 0;
        break;
      case "reverse":
        effectTimers.reverse = EFFECT_DURATION_FRAMES;
        break;
    }
  }

  function updateEffects() {
    for (const k in effectTimers) {
      if (effectTimers[k] > 0) effectTimers[k]--;
    }

    if (effectTimers.expand > 0) {
      paddle.width = BASE_PADDLE_WIDTH * 1.6;
    } else if (effectTimers.shrink > 0) {
      paddle.width = BASE_PADDLE_WIDTH * 0.6;
    } else {
      paddle.width = BASE_PADDLE_WIDTH;
    }

    for (const b of balls) {
      if (effectTimers.bigBall > 0) {
        b.radius = BASE_BALL_RADIUS * 1.7;
      } else if (effectTimers.smallBall > 0) {
        b.radius = BASE_BALL_RADIUS * 0.6;
      } else {
        b.radius = BASE_BALL_RADIUS;
      }
    }
  }

  function drawBackground() {
    ctx.clearRect(0, 0, W, H);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#020617");
    grad.addColorStop(1, "#020617");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBricks() {
    for (const brick of bricks) drawBrick(brick);
  }

  function drawPowerups() {
    for (const p of powerups) drawPowerup(p);
  }

  function drawBalls() {
    for (const b of balls) drawBall(b);
  }

  function drawHUD() {
    ctx.save();
    ctx.font = "12px system-ui";
    ctx.fillStyle = "rgba(148,163,184,.9)";
    ctx.fillText("道具：E 加長 S 短 M 多球 F 火球 K 黏 U 快 D 慢 L 命 Z 雷 H 盾 B 大 C 小 R 反", 16, 24);
    ctx.restore();
  }

  function loop() {
    drawBackground();
    updatePaddle();
    updateBalls();
    updatePowerups();
    updateBullets();
    updateEffects();

    drawBricks();
    drawShield();
    drawPowerups();
    drawBullets();
    drawPaddle();
    drawBalls();
    drawHUD();

    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keyLeft = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keyRight = true;
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keyLeft = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keyRight = false;
  });
  canvas.addEventListener("mousemove", function (e) {
    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;

    paddle.x = mouseX - paddle.width / 2;

    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > W) paddle.x = W - paddle.width;
});

  resetGame(true);
  requestAnimationFrame(loop);
</script>
</body>
</html>
