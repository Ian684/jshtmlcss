
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Step 7: AI 自動展示與完整遊戲（馬卡龍版）</title>
<style>
/* ========== 全局設定 ========== */
body {
    margin: 0; padding: 0;
    font-family: "微軟正黑體", "Segoe UI", sans-serif;
    background-color: #fdfcf0;
    display: flex;
    height: 100vh;
    overflow: hidden;
    color: #555;
}

/* ========== 左側控制台 ========== */
#sidebar {
    width: 280px;
    background-color: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 15px rgba(0,0,0,0.05);
    z-index: 10;
    border-right: 1px solid #eee;
}

h2 { margin: 0 0 15px 0; font-size: 22px; color: #ff8b94; border-bottom: 3px solid #ffaaa5; padding-bottom: 10px; }
h3 { margin: 20px 0 8px 0; font-size: 16px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

button {
    padding: 12px; margin-bottom: 8px;
    border: none; border-radius: 10px;
    cursor: pointer; font-size: 15px; font-weight: bold;
    transition: all 0.2s ease; color: white; text-align: left; padding-left: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
button:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.15); }
button:active { transform: scale(0.98); }

.btn-level { background-color: #a0c4ff; }
.btn-level:hover { background-color: #8ab6ff; }

.btn-auto { background-color: #ff9aa2; border: 2px dashed #fff; }
.btn-auto.active { background-color: #ff6f7d; border-color: #ffdac1; animation: pulse 1s infinite; }

.btn-long { background-color: #b9fbc0; color: #444; }
.btn-short { background-color: #ffb7b2; color: #444; }
.btn-life { background-color: #ffdac1; color: #444; }
.btn-multi { background-color: #9bf6ff; color: #444; }
.btn-gun { background-color: #bdb2ff; color: white; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

/* ========== 右側遊戲區 ========== */
#game-stage {
    flex: 1;
    background-color: #f4f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
    background-size: 20px 20px;
}

#game-frame {
    width: 800px;
    height: 600px;
    background-color: #fff;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    border-radius: 12px;
    border: 6px solid #fff;
    overflow: hidden;
}

/* ========== 遊戲物件 ========== */
.game-obj { position: absolute; border-radius: 4px; box-sizing: border-box; }

#paddle { border-radius: 10px; background: #8ac6d1; border: 2px solid #fff; }
.ball { border-radius: 50%; background: #ffb7b2; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1); }
.brick { border-radius: 3px; border: 1px solid rgba(255,255,255,0.5); }

.game-ui { position: absolute; color: #777; font-weight: 800; font-size: 18px; pointer-events: none; z-index: 20; }

.bullet { border-radius: 50%; background: #ffdac1; box-shadow: 0 0 8px #ffdac1; }

#msg-overlay {
    position: absolute; width: 100%; top: 260px; text-align: center;
    color: #888; font-size: 32px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 2px 2px 0px #fff; pointer-events: none; z-index: 30;
}

.debug-info { margin-top: auto; font-size: 13px; color: #aaa; line-height: 1.6; background: #f9f9f9; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>

<div id="sidebar">
    <h2>🍬 馬卡龍教學台</h2>
    
    <h3>模式控制</h3>
    <button id="btn-auto" class="btn-auto" onclick="toggleAuto()">🤖 啟動自動展示</button>

    <h3>選擇複雜地圖 (800x600)</h3>
    <button class="btn-level" onclick="initGame(1)">Level 1: 彩虹千層</button>
    <button class="btn-level" onclick="initGame(2)">Level 2: 愛心馬賽克</button>
    <button class="btn-level" onclick="initGame(3)">Level 3: 雙子金字塔</button>
    
    <h3>上帝模式 (強制觸發)</h3>
    <button class="btn-long" onclick="triggerCapsule(0)">📏 變長 (薄荷)</button>
    <button class="btn-short" onclick="triggerCapsule(1)">🤏 變短 (淺紅)</button>
    <button class="btn-life" onclick="triggerCapsule(2)">💖 加命 (蜜桃)</button>
    <button class="btn-multi" onclick="triggerCapsule(3)">🥎 多球 (寶寶藍)</button>
    <button class="btn-gun" onclick="triggerCapsule(4)">🔫 射擊 (薰衣草)</button>
    
    <div class="debug-info">
        <div>球體數量: <b id="debug-balls">0</b></div>
        <div>磚塊剩餘: <b id="debug-bricks">0</b></div>
        <div>自動模式: <b id="debug-auto">OFF</b></div>
    </div>
</div>

<div id="game-stage">
    <div id="game-frame"></div>
</div>

<script>
console.log('=================================');
console.log('🍬 馬卡龍打磚塊課程 - Step 7 (Final)');
console.log('主題：AI 自動展示與完整遊戲');
console.log('👤 使用者：yienou');
console.log('📅 時間：2025-11-19 08:05:37 UTC');
console.log('=================================');

// ==========================================
// 1. 全域設定
// ==========================================
var frame = document.getElementById("game-frame");
var timer = null;
var gameRunning = false;
var autoMode = false;

var xsize = 16, ysize = 12; 
var GAME_W = 800, GAME_H = 600;

var score = 0, lives = 3, paddleWidth = 120, hasGun = false, frameCount = 0;
var balls = [], bullets = [], capsules = [], bricks = [];

// 馬卡龍色票
const COLORS = [
    "#ffadad", "#ffd6a5", "#fdffb6", "#caffbf",
    "#9bf6ff", "#a0c4ff", "#bdb2ff", "#ffc6ff"
];

// ==========================================
// 2. 系統核心
// ==========================================

function createDiv(id, x, y, w, h, bg, cls) {
    var d = document.createElement("div");
    d.id = id;
    d.className = "game-obj " + (cls || "");
    d.style.left = x + "px"; d.style.top = y + "px";
    d.style.width = w + "px"; d.style.height = h + "px";
    d.style.background = bg;
    frame.appendChild(d);
    return d;
}

function createText(id, x, y, txt) {
    var d = document.createElement("div");
    d.id = id; d.className = "game-ui";
    d.style.left = x + "px"; d.style.top = y + "px";
    d.innerHTML = txt;
    frame.appendChild(d);
    return d;
}

function showMsg(txt) {
    var msg = document.getElementById("msg-overlay");
    if(!msg) {
        msg = document.createElement("div");
        msg.id = "msg-overlay";
        frame.appendChild(msg);
    }
    msg.innerHTML = txt;
}

function toggleAuto() {
    autoMode = !autoMode;
    var btn = document.getElementById("btn-auto");
    var label = document.getElementById("debug-auto");
    
    if(autoMode) {
        btn.classList.add("active");
        btn.innerHTML = "🤖 自動展示中...";
        label.innerText = "ON";
        label.style.color = "green";
        if(lives > 0 && balls.length == 0) handleMouseDown();
    } else {
        btn.classList.remove("active");
        btn.innerHTML = "🤖 啟動自動展示";
        label.innerText = "OFF";
        label.style.color = "#aaa";
    }
}

// 初始化遊戲
function initGame(level) {
    gameRunning = false;
    if(timer) clearInterval(timer);
    frame.innerHTML = "";
    balls = []; bullets = []; capsules = []; bricks = [];
    for(var i=0; i<xsize; i++) bricks[i] = [];
    
    score = 0; lives = 3; paddleWidth = 120; hasGun = false; frameCount = 0;
    
    var p = createDiv("paddle", (GAME_W/2 - paddleWidth/2), GAME_H-50, paddleWidth, 20, "#8ac6d1");
    p.style.boxShadow = "0 4px 0 #6faabb";
    
    createText("ui-score", 20, 15, "SCORE: 0");
    createText("ui-lives", GAME_W-120, 15, "LIVES: 3");
    showMsg(`LEVEL ${level} READY`);

    // 建立複雜地圖
    var brickCount = 0;
    for(var x=0; x<xsize; x++) {
        for(var y=0; y<ysize; y++) {
            var active = 0;
            
            if(level == 1) {
                if(y < 8) active = 1;
            } 
            else if(level == 2) {
                let u = (x - xsize/2) / (xsize/4);
                let v = -(y - ysize/2) / (ysize/4) - 0.5; 
                if( Math.pow(u*u + v*v - 1, 3) - u*u*v*v*v <= 0 ) active = 1;
            } 
            else if(level == 3) {
                if(x < xsize/2 && y <= x) active = 1;
                if(x >= xsize/2 && y <= (xsize-1 - x)) active = 1;
            }
            
            bricks[x][y] = active;
            if(active) {
                brickCount++;
                var color = COLORS[y % COLORS.length];
                createDiv("B"+x+"_"+y, x*50, y*30 + 50, 48, 28, color, "brick");
            }
        }
    }
    document.getElementById("debug-bricks").innerText = brickCount;

    frame.onmousemove = handleMouseMove;
    frame.onmousedown = handleMouseDown;
    timer = setInterval(gameLoop, 1000/60);
    updateDebug();
    
    console.log(`✅ Level ${level} 已載入，磚塊數：${brickCount}`);
}

// ==========================================
// 3. 遊戲邏輯
// ==========================================

function spawnBall(x, y, dx, dy) {
    var id = "ball_" + Math.random();
    createDiv(id, x, y, 12, 12, "#ffb7b2", "ball");
    balls.push({id:id, x:x, y:y, dx:dx, dy:dy});
    updateDebug();
}

function handleMouseMove(e) {
    if(autoMode) return;
    if(!gameRunning && balls.length > 0) return;
    
    var rect = frame.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    movePaddle(mx);
}

function movePaddle(targetCenterX) {
    var p = document.getElementById("paddle");
    if(!p) return;
    
    var newLeft = targetCenterX - paddleWidth/2;
    if(newLeft < 0) newLeft = 0;
    if(newLeft > GAME_W - paddleWidth) newLeft = GAME_W - paddleWidth;
    
    p.style.left = newLeft + "px";
}

function handleMouseDown() {
    if(lives > 0 && balls.length == 0) {
        gameRunning = true;
        showMsg("");
        spawnBall(GAME_W/2, GAME_H-100, 4, -4);
    }
}

// AI 自動控制
function autoPlayLogic() {
    if(balls.length == 0) return;

    var targetBall = balls[0];
    var maxY = -1;
    
    for(var i=0; i<balls.length; i++) {
        if(balls[i].y > maxY) {
            maxY = balls[i].y;
            targetBall = balls[i];
        }
    }

    var p = document.getElementById("paddle");
    var currentLeft = parseFloat(p.style.left);
    var currentCenter = currentLeft + paddleWidth/2;
    var ballCenter = targetBall.x + 6;

    var nextCenter = currentCenter + (ballCenter - currentCenter) * 0.2;
    
    if(targetBall.y > GAME_H - 150) nextCenter = ballCenter; 

    movePaddle(nextCenter);
}

function triggerCapsule(type) {
    var p = document.getElementById("paddle");
    if(!p) return;
    if(type==0) { paddleWidth = Math.min(paddleWidth+40, 300); p.style.width=paddleWidth+"px"; }
    if(type==1) { paddleWidth = Math.max(paddleWidth-40, 60); p.style.width=paddleWidth+"px"; }
    if(type==2) { lives++; document.getElementById("ui-lives").innerHTML="LIVES: "+lives; }
    if(type==3) {
        if(balls.length==0 && lives>0) spawnBall(GAME_W/2, GAME_H-100, 4, -4);
        else if(balls.length>0) {
            var ref = balls[0];
            spawnBall(ref.x, ref.y, 3, -5);
            spawnBall(ref.x, ref.y, -3, -5);
        }
    }
    if(type==4) { hasGun=true; p.style.background="#bdb2ff"; }
}

function gameLoop() {
    if(autoMode && gameRunning) autoPlayLogic();
    if(!gameRunning) {
        if(autoMode && lives > 0 && balls.length == 0) handleMouseDown();
        return;
    }
    
    frameCount++;

    // 自動射擊
    if(hasGun && frameCount % 15 == 0) {
        var p = document.getElementById("paddle");
        var pLeft = parseFloat(p.style.left);
        createBullet(pLeft + 10);
        createBullet(pLeft + paddleWidth - 10);
    }

    // 子彈移動
    for(var i=0; i<bullets.length; i++) {
        var b = bullets[i]; b.y -= 8;
        var el = document.getElementById(b.id);
        var hit = checkBrickHit(b.x, b.y);
        if(b.y < 0 || hit) {
            if(el) el.remove(); bullets.splice(i,1); i--;
            if(hit) addScore(5);
        } else if(el) el.style.top = b.y+"px";
    }

    // 球移動
    for(var i=0; i<balls.length; i++) {
        var b = balls[i];
        b.x += b.dx; b.y += b.dy;

        if(b.x > GAME_W-12 || b.x < 0) b.dx = -b.dx;
        if(b.y < 0) b.dy = -b.dy;

        if(checkBrickHit(b.x, b.y)) {
            b.dy = -b.dy;
            addScore(10);
            if(Math.random() > 0.8) dropCapsule(b.x, b.y);
        }

        var p = document.getElementById("paddle");
        var pLeft = parseFloat(p.style.left);
        var pCenter = pLeft + paddleWidth/2;
        var bCenter = b.x + 6;
        
        if(b.y > GAME_H-60 && b.y < GAME_H-40 && Math.abs(pCenter - bCenter) < (paddleWidth/2 + 10)) {
            if(b.dy > 0) {
                b.dy = -b.dy;
                var diff = (bCenter - pCenter) / (paddleWidth/2);
                b.dx = diff * 8;
            }
        }

        if(b.y > GAME_H) {
            var el = document.getElementById(b.id); if(el) el.remove();
            balls.splice(i,1); i--;
            updateDebug();
        } else {
            var el = document.getElementById(b.id);
            if(el) { el.style.left=b.x+"px"; el.style.top=b.y+"px"; }
        }
    }

    // 膠囊移動
    for(var i=0; i<capsules.length; i++) {
        var c = capsules[i]; c.y += 4;
        var el = document.getElementById(c.id);
        var p = document.getElementById("paddle");
        var pLeft = parseFloat(p.style.left);
        
        if(c.y > GAME_H-60 && c.y < GAME_H-40 && c.x > pLeft && c.x < pLeft+paddleWidth) {
            triggerCapsule(c.type);
            if(el) el.remove(); capsules.splice(i,1); i--;
        } else if(c.y > GAME_H) {
            if(el) el.remove(); capsules.splice(i,1); i--;
        } else if(el) el.style.top = c.y+"px";
    }

    // 輸贏判斷
    if(balls.length == 0 && gameRunning) {
        gameRunning = false;
        lives--;
        document.getElementById("ui-lives").innerHTML="LIVES: "+lives;
        hasGun = false; document.getElementById("paddle").style.background="#8ac6d1";
        
        if(lives > 0) showMsg("準備重生...");
        else showMsg("GAME OVER");
    }
    
    var brickLeft = parseInt(document.getElementById("debug-bricks").innerText);
    if(brickLeft <= 0 && gameRunning) {
        gameRunning = false;
        showMsg("LEVEL CLEARED! 🎉");
    }
}

function createBullet(x) {
    var id = "b_"+Math.random();
    createDiv(id, x, GAME_H-60, 6, 10, "#ffdac1", "bullet");
    bullets.push({id:id, x:x, y:GAME_H-60});
}

function checkBrickHit(x, y) {
    var row = Math.floor((y - 50) / 30); 
    var col = Math.floor(x / 50);
    
    if(col >= 0 && col < xsize && row >= 0 && row < ysize && bricks[col][row] == 1) {
        bricks[col][row] = 0;
        var el = document.getElementById("B"+col+"_"+row);
        if(el) {
            el.style.transform = "scale(0)";
            el.style.opacity = "0";
            setTimeout(()=>el.remove(), 200);
        }
        var cnt = parseInt(document.getElementById("debug-bricks").innerText);
        document.getElementById("debug-bricks").innerText = cnt - 1;
        return true;
    }
    return false;
}

function addScore(s) {
    score += s;
    document.getElementById("ui-score").innerHTML = "SCORE: " + score;
}

function dropCapsule(x, y) {
    var type = Math.floor(Math.random() * 5);
    var colors = ["#b9fbc0", "#ffb7b2", "#ffdac1", "#9bf6ff", "#bdb2ff"];
    var id = "c_"+Math.random();
    createDiv(id, x, y, 24, 12, colors[type], "brick");
    capsules.push({id:id, x:x, y:y, type:type});
}

function updateDebug() {
    document.getElementById("debug-balls").innerText = balls.length;
}

// 啟動 Level 1
initGame(1);

console.log('✅ 遊戲已完整載入');
console.log('🤖 可點擊「啟動自動展示」觀看 AI 玩遊戲');
console.log('🎮 或手動點擊畫面發射球開始遊玩');
console.log('=================================');

</script>
</body>
</html>
